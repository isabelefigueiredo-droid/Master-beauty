/* ─── Atoms ─── */
function Dot({color,size=8}){
  return <span style={{width:`${size}px`,height:`${size}px`,borderRadius:"50%",background:color,display:"inline-block",flexShrink:0}}/>;
}

function Pill({children,bg,color,dot,size=11}){
  return(
    <span style={{display:"inline-flex",alignItems:"center",gap:"5px",fontSize:`${size}px`,fontWeight:500,background:bg,color,borderRadius:"5px",padding:"3px 8px",whiteSpace:"nowrap",letterSpacing:"-0.05px"}}>
      {dot&&<Dot color={dot} size={5}/>}
      {children}
    </span>
  );
}

/* ─── Progress Ring ─── */
function ProgressRing({progress,size=64,stroke=4,color,bgColor}){
  const r=(size-stroke)/2;
  const c=2*Math.PI*r;
  const offset=c-(progress/100)*c;
  return(
    <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
      <circle cx={size/2} cy={size/2} r={r} stroke={bgColor} strokeWidth={stroke} fill="none"/>
      <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none"
        strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round"
        style={{transition:"stroke-dashoffset 0.8s cubic-bezier(0.22,1,0.36,1)"}}/>
    </svg>
  );
}

/* ─── Sparkline (mini chart) ─── */
function Sparkline({data,color,width=120,height=32}){
  if(!data||data.length<2)return null;
  const max=Math.max(...data,1);
  const min=Math.min(...data,0);
  const range=max-min||1;
  const points=data.map((v,i)=>{
    const x=(i/(data.length-1))*width;
    const y=height-((v-min)/range)*height;
    return `${x},${y}`;
  }).join(" ");
  return(
    <svg width={width} height={height} style={{display:"block"}}>
      <polyline fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" points={points}/>
      {data.map((v,i)=>{
        const x=(i/(data.length-1))*width;
        const y=height-((v-min)/range)*height;
        return <circle key={i} cx={x} cy={y} r={i===data.length-1?2.5:1.5} fill={color}/>;
      })}
    </svg>
  );
}

function TaskCard({task,project,onEdit,D}){

  const p=D[task.priority];
  const[h,setH]=useState(false);
  return(

      style={{background:h?D.cardSubtle:D.card,borderRadius:"10px",padding:"14px 15px",marginBottom:"7px",cursor:"pointer",

        boxShadow:h?D.shadowH:D.shadow,
        transform:h?"translateY(-1px)":"none",transition:"all 0.18s cubic-bezier(0.22,1,0.36,1)",

  // Week timeline
  const wkStart=new Date();
  const dow=(wkStart.getDay()+6)%7;
  wkStart.setDate(wkStart.getDate()-dow);
  const weekDays=Array.from({length:7},(_,i)=>{const d=new Date(wkStart);d.setDate(d.getDate()+i);return d.toISOString().split("T")[0];});
  const weekTasks={};weekDays.forEach(d=>{weekTasks[d]=tasks.filter(t=>t.deadline===d);});

  // Productivity sparkline — last 7 days completed
  const last7=Array.from({length:7},(_,i)=>{
    const d=new Date();d.setDate(d.getDate()-(6-i));
    const ds=d.toISOString().split("T")[0];
    return tasks.filter(t=>t.status==="done"&&t.deadline===ds).length;

  const totalDone7=last7.reduce((a,b)=>a+b,0);

        <KPI label="Esta semana" value={totalDone7} sub="concluídas" color={D.done.dot} sparkline={last7} D={D}/>
      </div>

      {/* ━━━ Urgência + Semana ━━━ */}

        {/* Urgência */}

                        return <div key={t.id} title={t.title} onClick={()=>onEditTask(t)}

            const total=pT.length;

          <div>
            <h3 style={{fontFamily:FS,fontSize:"20px",fontWeight:400,color:D.ink,letterSpacing:"-0.4px",lineHeight:1.1}}>Anotação rápida</h3>

/* ─── Project Mini Card ─── */

    <div onClick={onClick} onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)}

            {hasOv&&<Dot color={D.r} size={5}/>}

        </div>
      </div>
    </div>
  );
}

      {/* Hero */}

          <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"14px"}}>

        <div style={{display:"flex",gap:"6px"}}>

        </div>
      </div>

      {/* Stats */}
      <div style={{display:"grid",gridTemplateColumns:"320px 1fr 1fr 1fr",gap:"10px",marginBottom:"28px"}}>
        <div style={{background:D.card,borderRadius:"12px",border:`1px solid ${D.border}`,padding:"20px",display:"flex",alignItems:"center",gap:"18px",boxShadow:D.shadow}}>
          <div style={{position:"relative",width:"68px",height:"68px",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
            <ProgressRing progress={ratio} size={68} stroke={4} color={isProj?D.y:D.r} bgColor={D.border}/>

          <div>

            <p style={{fontSize:"15px",color:D.ink,fontWeight:600,letterSpacing:"-0.2px"}}>{counts.done} de {total} concluídas</p>
            <p style={{fontSize:"12px",color:D.ink3,marginTop:"3px"}}>{counts.doing} em andamento · {counts.todo} a fazer</p>
          </div>
        </div>
        {SCOLS.map(s=>{
          const m=D[s];
          return(
            <div key={s} style={{background:D.card,borderRadius:"12px",border:`1px solid ${D.border}`,padding:"20px",position:"relative",boxShadow:D.shadow}}>

              <div style={{display:"flex",alignItems:"center",gap:"6px",marginBottom:"10px"}}>
                <Dot color={m.dot} size={6}/>
                <span style={{fontSize:"11px",color:D.ink4,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.6px"}}>{STATS[s]}</span>
              </div>
              <div style={{fontFamily:FS,fontSize:"42px",fontWeight:300,color:D.ink,letterSpacing:"-1.5px",lineHeight:0.9}}>{counts[s]}</div>

      {/* Tasks */}
      <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",marginBottom:"16px"}}>
        <div>
          <h3 style={{fontFamily:FS,fontSize:"26px",fontWeight:400,color:D.ink,letterSpacing:"-0.7px"}}>Tarefas</h3>
          <p style={{fontSize:"12px",color:D.ink4,marginTop:"3px"}}>Organizadas por status</p>

      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"10px",alignItems:"start"}}>

          return(
            <div key={s} style={{background:m.bg,borderRadius:"12px",padding:"16px",border:`1px solid ${m.bdr}`}}>
              <div style={{display:"flex",alignItems:"center",gap:"7px",marginBottom:"14px"}}>
                <Dot color={m.dot}/>
                <span style={{fontWeight:600,fontSize:"12px",color:D.ink,letterSpacing:"-0.1px"}}>{STATS[s]}</span>
                <Pill bg={m.badge} color={m.btxt} size={10}>{col.length}</Pill>
              </div>
              {col.map(t=><TaskCard key={t.id} task={t} project={project} onEdit={onEditTask} D={D}/>)}
              {col.length===0&&<div style={{textAlign:"center",color:D.ink5,fontSize:"12px",padding:"20px 0",fontWeight:500,fontStyle:"italic"}}>Vazio</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ─── Calendar ─── */
function CalendarView({tasks,projects,onEdit,onNew,D}){
  const{btn}=buildStyles(D);
  const now=new Date();
  const[year,setYear]=useState(now.getFullYear());
  const[month,setMonth]=useState(now.getMonth());
  const monthName=new Date(year,month,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  const firstDay=(new Date(year,month,1).getDay()+6)%7;
  const daysInMonth=new Date(year,month+1,0).getDate();
  const prevM=()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);};
  const nextM=()=>{if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);};
  const byDay={};
  tasks.forEach(t=>{
    if(!t.deadline)return;
    const d=new Date(t.deadline+"T12:00:00");
    if(d.getFullYear()===year&&d.getMonth()===month){
      const n=d.getDate();
      if(!byDay[n])byDay[n]=[];
      byDay[n].push(t);
    }
  });
  const isToday=(d)=>{const n=new Date();return d===n.getDate()&&month===n.getMonth()&&year===n.getFullYear();};
  const DAYS=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
  const cells=[];
  for(let i=0;i<firstDay;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(d);
  return(
    <div className="fade">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"22px"}}>
        <h3 style={{fontFamily:FS,fontSize:"36px",fontWeight:300,color:D.ink,letterSpacing:"-1.2px",textTransform:"capitalize"}}>{monthName}</h3>
        <div style={{display:"flex",gap:"6px"}}>
          <button onClick={prevM} style={{...btn.ghost,padding:"6px 12px",fontSize:"14px"}}>‹</button>
          <button onClick={()=>{setYear(now.getFullYear());setMonth(now.getMonth());}} style={{...btn.ghost,padding:"6px 12px",fontSize:"12px"}}>Hoje</button>
          <button onClick={nextM} style={{...btn.ghost,padding:"6px 12px",fontSize:"14px"}}>›</button>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"5px",marginBottom:"5px"}}>
        {DAYS.map(d=><div key={d} style={{textAlign:"center",fontSize:"11px",fontWeight:600,color:D.ink4,padding:"6px 0",letterSpacing:"0.4px"}}>{d}</div>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"5px"}}>
        {cells.map((day,i)=>{
          if(!day)return<div key={`e${i}`}/>;
          const dt=byDay[day]||[];
          const today=isToday(day);
          const hasOv=dt.some(t=>t.status!=="done"&&isOv(t.deadline));
          return(
            <div key={day}
              style={{minHeight:"96px",background:today?D.y:D.card,borderRadius:"10px",padding:"9px",
                border:today?`1px solid ${D.yd}`:hasOv?`1px solid ${D===themes.dark?"#5A2A2A":"#FBD8D0"}`:`1px solid ${D.border}`,
                cursor:"pointer",transition:"all 0.15s",boxShadow:today?"0 2px 10px rgba(255,230,0,0.4)":D.shadow}}
              onClick={()=>dt.length===0&&onNew({deadline:`${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`})}>
              <div style={{fontSize:"12px",fontWeight:today?700:600,color:today?"#1A1714":D.ink2,marginBottom:"6px"}}>{day}</div>
              {dt.slice(0,3).map(t=>{
                const ov=t.status!=="done"&&isOv(t.deadline);
                const m=D[t.status];
                return(
                  <div key={t.id} onClick={e=>{e.stopPropagation();onEdit(t);}}
                    style={{fontSize:"10px",fontWeight:500,color:ov?D.r:m.btxt,background:ov?(D===themes.dark?"#3A1A1A":"#FEF2F2"):m.badge,borderRadius:"4px",padding:"2px 6px",marginBottom:"3px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",lineHeight:1.4}}>
                    {t.title}
                  </div>
                );
              })}
              {dt.length>3&&<div style={{fontSize:"9px",fontWeight:600,color:D.ink4}}>+{dt.length-3}</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ─── Notifications ─── */
function notifyAlerts(tasks){
  if(!("Notification"in window)){alert("Navegador não suporta notificações.");return;}
  Notification.requestPermission().then(p=>{
    if(p!=="granted")return;
    const ov=tasks.filter(t=>t.status!=="done"&&isOv(t.deadline));
    const td=tasks.filter(t=>t.status!=="done"&&isTd(t.deadline));
    if(ov.length)new Notification("Tarefas atrasadas",{body:ov.map(t=>t.title).join(", ")});
    if(td.length)new Notification("Vence hoje",{body:td.map(t=>t.title).join(", ")});
    if(!ov.length&&!td.length)new Notification("Tudo em dia",{body:"Nenhuma tarefa pendente."});
  });
}

        <div style={{padding:sbExpanded?"14px 10px 0":"14px 8px 0"}}>
          {sbExpanded&&<p style={{fontSize:"10px",fontWeight:600,color:D.ink4,letterSpacing:"0.9px",padding:"0 6px 8px",textTransform:"uppercase",margin:0}}>Workspace</p>}
          {NAV.map(n=><NavItem key={n.id} {...n} active={tab===n.id||(n.id==="projetos"&&tab==="projeto-detail")} onClick={()=>{setTab(n.id);setOpenProjectId(null);}} collapsed={!sbExpanded} D={D}/>)}
          {sbExpanded&&<p style={{fontSize:"10px",fontWeight:600,color:D.ink4,letterSpacing:"0.9px",padding:"18px 6px 8px",textTransform:"uppercase",margin:0}}>Diretório</p>}
          <NavItem icon="↗" label="Links Úteis" active={tab==="links"} onClick={()=>{setTab("links");setOpenProjectId(null);}} count={links.length} collapsed={!sbExpanded} D={D}/>
        </div>

        {/* Notifications */}
        {sbExpanded&&<div style={{padding:"14px 12px 0"}}>
          <button onClick={()=>notifyAlerts(tasks)}
            style={{width:"100%",padding:"9px 11px",background:D.cardSubtle,border:`1px solid ${D.border}`,borderRadius:"7px",cursor:"pointer",display:"flex",alignItems:"center",gap:"7px",fontSize:"12px",fontWeight:500,color:D.ink3,fontFamily:F,transition:"all 0.12s"}}
            onMouseEnter={e=>{e.currentTarget.style.background=D.yp;e.currentTarget.style.borderColor=D.ym;}}
            onMouseLeave={e=>{e.currentTarget.style.background=D.cardSubtle;e.currentTarget.style.borderColor=D.border;}}>
            <span>🔔</span><span>Alertas do navegador</span>
          </button>
        </div>}

        {/* Stats */}
        {sbExpanded&&<div style={{marginTop:"auto",padding:"16px 12px 20px"}}>
          <div style={{background:D.cardSubtle,borderRadius:"10px",padding:"14px",border:`1px solid ${D.border}`}}>
            <p style={{fontSize:"10px",fontWeight:600,color:D.ink4,letterSpacing:"0.8px",textTransform:"uppercase",margin:"0 0 11px"}}>Resumo</p>
            {SCOLS.map(s=>{const n=tasks.filter(t=>t.status===s).length;return(
              <div key={s} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"7px"}}>
                <span style={{display:"flex",alignItems:"center",gap:"6px",fontSize:"12px",color:D.ink3}}>
                  <Dot color={D[s].dot} size={6}/>{STATS[s]}
                </span>
                <span style={{fontWeight:600,fontSize:"12px",color:D.ink}}>{n}</span>
              </div>
            );})}
            <div style={{height:"1px",background:D.border,margin:"10px 0"}}/>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:"6px"}}>
              <span style={{fontSize:"11px",color:D.ink3}}>◆ Projetos</span>
              <span style={{fontSize:"11px",fontWeight:600,background:D.yp,color:"#7A5800",borderRadius:"4px",padding:"1px 7px"}}>{projects.filter(p=>p.type==="projeto").length}</span>
            </div>
            <div style={{display:"flex",justifyContent:"space-between"}}>
              <span style={{fontSize:"11px",color:D.ink3}}>◇ Clientes</span>
              <span style={{fontSize:"11px",fontWeight:600,background:D.rp,color:D.r,borderRadius:"4px",padding:"1px 7px"}}>{projects.filter(p=>p.type==="cliente").length}</span>
            </div>
          </div>
        </div>}
      </aside>

      {/* ══ MAIN ══ */}
      <div style={{marginLeft:64,transition:"margin-left 0.25s cubic-bezier(0.22,1,0.36,1)"}}>

        {tab!=="projeto-detail"&&(
          <header style={{background:D.card,borderBottom:`1px solid ${D.border}`,padding:"0 32px",height:"58px",display:"flex",alignItems:"center",gap:"12px",position:"sticky",top:0,zIndex:40,boxShadow:`0 1px 0 ${D.border}`}}>
            <h2 style={{fontSize:"17px",fontWeight:600,margin:0,color:D.ink,letterSpacing:"-0.3px",flexShrink:0}}>{tabLabel[tab]}</h2>

            {/* Search trigger */}
            <button onClick={()=>setShowCmdK(true)}
              style={{display:"flex",alignItems:"center",gap:"8px",padding:"6px 10px",background:D.cardSubtle,border:`1px solid ${D.border}`,borderRadius:"7px",fontSize:"12px",color:D.ink4,cursor:"pointer",fontFamily:F,marginLeft:"8px",minWidth:"200px",transition:"all 0.12s"}}
              onMouseEnter={e=>e.currentTarget.style.background=D.bg}
              onMouseLeave={e=>e.currentTarget.style.background=D.cardSubtle}>
              <span style={{fontSize:"12px"}}>🔍</span>
              <span style={{flex:1,textAlign:"left"}}>Buscar...</span>
              <span style={{fontSize:"10px",fontWeight:600,letterSpacing:"0.5px",border:`1px solid ${D.border}`,padding:"1px 5px",borderRadius:"4px"}}>⌘K</span>
            </button>

            {(tab==="kanban"||tab==="list")&&(
              <div style={{display:"flex",gap:"6px"}}>
                <select style={{...inp,width:"auto",padding:"6px 28px 6px 10px",fontSize:"12px",color:fProj?D.ink:D.ink3}} value={fProj} onChange={e=>setFProj(e.target.value)}>
                  <option value="">Todos os projetos</option>
                  {projects.map(p=><option key={p.id} value={p.id}>{p.type==="projeto"?"◆":"◇"} {p.name}</option>)}
                </select>
                <select style={{...inp,width:"auto",padding:"6px 28px 6px 10px",fontSize:"12px",color:fStatus?D.ink:D.ink3}} value={fStatus} onChange={e=>setFStatus(e.target.value)}>
                  <option value="">Todos os status</option>
                  {Object.entries(STATS).map(([k,v])=><option key={k} value={k}>{v}</option>)}
                </select>
                <select style={{...inp,width:"auto",padding:"6px 28px 6px 10px",fontSize:"12px",color:fPrio?D.ink:D.ink3}} value={fPrio} onChange={e=>setFPrio(e.target.value)}>
                  <option value="">Todas prioridades</option>
                  <option value="alta">Alta</option><option value="media">Média</option><option value="baixa">Baixa</option>
                </select>
              </div>
            )}

            {tab==="links"&&(
              <div style={{display:"flex",gap:"6px"}}>
                <input style={{...inp,width:"180px",padding:"6px 10px",fontSize:"12px"}} placeholder="Buscar links..." value={lq} onChange={e=>setLq(e.target.value)}/>
                <select style={{...inp,width:"auto",padding:"6px 28px 6px 10px",fontSize:"12px"}} value={lcat} onChange={e=>setLcat(e.target.value)}>
                  <option value="">Todas categorias</option>
                  {cats.map(c=><option key={c} value={c}>{c}</option>)}
                </select>
              </div>
            )}

            <div style={{marginLeft:"auto",display:"flex",gap:"6px",alignItems:"center"}}>
              {/* Theme toggle */}
              <button onClick={toggleMode} title={mode==="light"?"Modo escuro":"Modo claro"}
                style={{padding:"7px 9px",background:"transparent",border:`1px solid ${D.border}`,borderRadius:"7px",cursor:"pointer",fontSize:"13px",color:D.ink3,transition:"all 0.15s"}}
                onMouseEnter={e=>e.currentTarget.style.background=D.cardSubtle}
                onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                {mode==="light"?"☾":"☀"}
              </button>

              {/* Action button */}
              {tab==="projetos"&&<button onClick={()=>setShowProject(true)} style={btn.primary} onMouseEnter={e=>e.currentTarget.style.background=D.yh} onMouseLeave={e=>e.currentTarget.style.background=D.y}>+ Novo Projeto</button>}
              {(tab==="kanban"||tab==="list"||tab==="home"||tab==="calendario")&&<button onClick={()=>openNew()} style={btn.primary} onMouseEnter={e=>e.currentTarget.style.background=D.yh} onMouseLeave={e=>e.currentTarget.style.background=D.y}>+ Nova Tarefa</button>}
              {tab==="links"&&<button onClick={()=>setShowLink(true)} style={btn.rose} onMouseEnter={e=>e.currentTarget.style.background=D.rh} onMouseLeave={e=>e.currentTarget.style.background=D.r}>+ Novo Link</button>}

              {/* Avatar */}
              <div style={{width:"32px",height:"32px",borderRadius:"50%",background:`linear-gradient(135deg, ${D.y}, ${D.r})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"12px",fontWeight:700,color:"#1A1714",border:`2px solid ${D.card}`,boxShadow:D.shadow,marginLeft:"4px",cursor:"pointer"}} title={user}>
                {user.charAt(0).toUpperCase()}
              </div>
            </div>
          </header>
        )}

        <main style={{padding:"32px 36px"}}>

          {tab==="home"&&<Dashboard tasks={tasks} projects={projects} onEditTask={openEdit} onOpenProject={openProject} onTab={setTab} onNewTask={openNew} note={note} setNote={saveNote} D={D} user={user}/>}

          {tab==="kanban"&&(
            <div className="fade" style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"12px",alignItems:"start"}}>
              {SCOLS.map(status=>{
                const col=filteredTasks.filter(t=>t.status===status),m=D[status];
                return(
                  <div key={status} style={{background:m.bg,borderRadius:"12px",padding:"16px",border:`1px solid ${m.bdr}`}}>
                    <div style={{display:"flex",alignItems:"center",gap:"7px",marginBottom:"14px"}}>
                      <Dot color={m.dot}/>
                      <span style={{fontWeight:600,fontSize:"12px",color:D.ink,letterSpacing:"-0.1px"}}>{STATS[status]}</span>
                      <Pill bg={m.badge} color={m.btxt} size={10}>{col.length}</Pill>
                    </div>
                    {col.map(t=>{
                      const proj=projects.find(p=>p.id===t.projectId);
                      return <TaskCard key={t.id} task={t} project={proj} onEdit={openEdit} D={D}/>;
                    })}
                    {col.length===0&&<div style={{textAlign:"center",color:D.ink5,fontSize:"12px",padding:"24px 0",fontStyle:"italic"}}>Vazio</div>}
                  </div>
                );
              })}
            </div>
          )}

          {tab==="list"&&(
            <div className="fade">
              {confirmDel&&<Confirm D={D} msg="Excluir esta tarefa?" sub={`"${confirmDel.title}" será removida permanentemente.`} onYes={()=>handleDelTask(confirmDel.id)} onNo={()=>setConfirmDel(null)}/>}
              <div style={{background:D.card,borderRadius:"12px",overflow:"hidden",border:`1px solid ${D.border}`,boxShadow:D.shadow}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:"13px"}}>
                  <thead>
                    <tr style={{background:D.cardSubtle,borderBottom:`1px solid ${D.border}`}}>
                      {["Tarefa","Projeto","Prazo","Status","Prioridade",""].map((h,i)=>(
                        <th key={i} style={{padding:"11px 16px",textAlign:"left",fontWeight:600,color:D.ink4,fontSize:"11px",textTransform:"uppercase",letterSpacing:"0.5px",whiteSpace:"nowrap"}}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {filteredTasks.map(t=>{
                      const ov=t.status!=="done"&&isOv(t.deadline);
                      const td=t.status!=="done"&&isTd(t.deadline);
                      const p=D[t.priority],m=D[t.status];
                      const proj=projects.find(pr=>pr.id===t.projectId);
                      return(
                        <tr key={t.id} style={{borderBottom:`1px solid ${D.border2}`,background:ov?(mode==="dark"?"#241818":"#FEF7F4"):td?D.yp:D.card,transition:"background 0.1s"}}
                          onMouseEnter={e=>{if(!ov&&!td)e.currentTarget.style.background=D.cardSubtle;}}
                          onMouseLeave={e=>{e.currentTarget.style.background=ov?(mode==="dark"?"#241818":"#FEF7F4"):td?D.yp:D.card;}}>
                          <td style={{padding:"13px 16px",fontWeight:500,color:D.ink,cursor:"pointer",letterSpacing:"-0.1px"}} onClick={()=>openEdit(t)}>
                            <span style={{display:"inline-flex",alignItems:"center",gap:"8px"}}>
                              <Dot color={p.dot} size={5}/>
                              {ov&&<span style={{color:D.r,fontSize:"10px",fontWeight:600}}>Atrasada</span>}
                              {td&&<span style={{background:D.y,fontSize:"10px",borderRadius:"3px",padding:"1px 5px",fontWeight:600,color:"#1A1714"}}>hoje</span>}
                              <span>{t.title}</span>
                            </span>
                          </td>
                          <td style={{padding:"13px 16px",cursor:"pointer"}} onClick={()=>openEdit(t)}>
                            {proj?<Pill bg={proj.type==="projeto"?D.yp:D.rp} color={proj.type==="projeto"?"#7A5800":D.r}>
                              {proj.type==="projeto"?"◆":"◇"} {proj.name}
                            </Pill>:<span style={{color:D.ink5}}>—</span>}
                          </td>
                          <td style={{padding:"13px 16px",color:ov?D.r:D.ink4,fontWeight:ov?600:500,cursor:"pointer"}} onClick={()=>openEdit(t)}>{fmtFull(t.deadline)}</td>
                          <td style={{padding:"13px 16px",cursor:"pointer"}} onClick={()=>openEdit(t)}><Pill bg={m.badge} color={m.btxt} dot={m.dot}>{STATS[t.status]}</Pill></td>
                          <td style={{padding:"13px 16px",cursor:"pointer"}} onClick={()=>openEdit(t)}>
                            <span style={{display:"inline-flex",alignItems:"center",gap:"5px",fontSize:"11px",fontWeight:500,color:p.c}}>
                              <Dot color={p.dot} size={5}/>
                              {t.priority==="alta"?"Alta":t.priority==="media"?"Média":"Baixa"}
                            </span>
                          </td>
                          <td style={{padding:"13px 8px 13px 0",textAlign:"right"}}>
                            <button onClick={()=>setConfirmDel(t)} style={{...btn.danger,padding:"4px 9px",fontSize:"11px",borderRadius:"6px"}}>🗑</button>
                          </td>
                        </tr>
                      );
                    })}
                    {filteredTasks.length===0&&<tr><td colSpan={6} style={{padding:"56px",textAlign:"center",color:D.ink4,fontWeight:500}}>Nenhuma tarefa encontrada</td></tr>}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {tab==="projetos"&&(
            <div className="fade">
              {projects.length===0?
                <div style={{textAlign:"center",padding:"80px 0",color:D.ink4,fontSize:"14px"}}>
                  Nenhum projeto cadastrado.{" "}
                  <span style={{color:D.ink,cursor:"pointer",fontWeight:600,borderBottom:`2px solid ${D.y}`,paddingBottom:"1px"}} onClick={()=>setShowProject(true)}>Criar o primeiro</span>
                </div>
                :<>
                  {projects.filter(p=>p.type==="projeto").length>0&&<div style={{marginBottom:"32px"}}>
                    <div style={{display:"flex",alignItems:"baseline",gap:"10px",marginBottom:"14px"}}>
                      <h3 style={{fontFamily:FS,fontSize:"26px",fontWeight:300,color:D.ink,letterSpacing:"-0.7px"}}>Projetos</h3>
                      <span style={{fontSize:"12px",color:D.ink4,fontWeight:500}}>iniciativas internas</span>
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill, minmax(280px, 1fr))",gap:"10px"}}>
                      {projects.filter(p=>p.type==="projeto").map(p=>{
                        const pT=tasks.filter(t=>t.projectId===p.id);
                        const total=pT.length;
                        const done=pT.filter(t=>t.status==="done").length;
                        const ratio=total?Math.round((done/total)*100):0;
                        const hasOv=pT.some(t=>t.status!=="done"&&isOv(t.deadline));
                        return <ProjectMiniCard key={p.id} project={p} tasks={pT} ratio={ratio} hasOv={hasOv} isProj={true} onClick={()=>openProject(p.id)} D={D}/>;
                      })}
                    </div>
                  </div>}

                  {projects.filter(p=>p.type==="cliente").length>0&&<div>
                    <div style={{display:"flex",alignItems:"baseline",gap:"10px",marginBottom:"14px"}}>
                      <h3 style={{fontFamily:FS,fontSize:"26px",fontWeight:300,color:D.ink,letterSpacing:"-0.7px"}}>Clientes</h3>
                      <span style={{fontSize:"12px",color:D.ink4,fontWeight:500}}>contas externas</span>
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill, minmax(280px, 1fr))",gap:"10px"}}>
                      {projects.filter(p=>p.type==="cliente").map(p=>{
                        const pT=tasks.filter(t=>t.projectId===p.id);
                        const total=pT.length;
                        const done=pT.filter(t=>t.status==="done").length;
                        const ratio=total?Math.round((done/total)*100):0;
                        const hasOv=pT.some(t=>t.status!=="done"&&isOv(t.deadline));
                        return <ProjectMiniCard key={p.id} project={p} tasks={pT} ratio={ratio} hasOv={hasOv} isProj={false} onClick={()=>openProject(p.id)} D={D}/>;
                      })}
                    </div>
                  </div>}
                </>
              }
            </div>
          )}

          {tab==="projeto-detail"&&currentProject&&(
            <ProjectDetail D={D}
              project={currentProject}
              tasks={tasks.filter(t=>t.projectId===currentProject.id)}
              onBack={()=>{setTab("projetos");setOpenProjectId(null);}}
              onEditTask={openEdit}
              onNewTask={openNew}
              onDeleteProject={handleDelProject}
              onUpdateProject={handleSaveProject}/>
          )}

          {tab==="calendario"&&<CalendarView tasks={tasks} projects={projects} onEdit={openEdit} onNew={openNew} D={D}/>}

          {tab==="links"&&(()=>{
            const ac=[...new Set(filtLinks.map(l=>l.category||"Sem categoria"))];
            if(!ac.length)return<div style={{textAlign:"center",color:D.ink4,padding:"80px 0",fontWeight:500}}>Nenhum link encontrado</div>;
            return<div className="fade">{ac.map(cat=>{
              const cl=filtLinks.filter(l=>(l.category||"Sem categoria")===cat);
              return(
                <div key={cat} style={{marginBottom:"32px"}}>
                  <div style={{display:"flex",alignItems:"center",gap:"12px",marginBottom:"14px"}}>
                    <h3 style={{fontFamily:FS,fontSize:"24px",fontWeight:300,color:D.ink,margin:0,letterSpacing:"-0.5px"}}>{cat}</h3>
                    <div style={{flex:1,height:"1px",background:D.border}}/>
                    <span style={{fontSize:"11px",color:D.ink4,fontWeight:500}}>{cl.length}</span>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:"10px"}}>
                    {cl.map(l=><LinkCard key={l.id} link={l} onDelete={handleDelLink} D={D}/>)}
                  </div>
                </div>
              );
            })}</div>;
          })()}
        </main>
      </div>

      {showTask&&<TaskModal D={D} task={editTask} prefill={prefillTask} projects={projects} onSave={handleSaveTask} onDelete={handleDelTask} onClose={()=>{setShowTask(false);setEditTask(null);setPrefillTask(null);}}/>}
      {showProject&&<ProjectModal D={D} onSave={handleSaveProject} onClose={()=>setShowProject(false)}/>}
      {showLink&&<LinkModal D={D} cats={cats} onSave={handleSaveLink} onClose={()=>setShowLink(false)}/>}
      {showCmdK&&<CommandPalette D={D} tasks={tasks} projects={projects} onClose={()=>setShowCmdK(false)} onSelectTask={openEdit} onSelectProject={p=>openProject(p.id)} onTab={setTab}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
