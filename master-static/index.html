<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>MasterVida — Organize sua vida</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237C3AED'/><text x='5' y='24' font-size='22' fill='white'>M</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
:root{
  --primary:#7C3AED;--primary-light:#EDE9FE;
  --green:#10B981;--green-light:#D1FAE5;
  --amber:#F59E0B;--amber-light:#FEF3C7;
  --pink:#EC4899;--pink-light:#FCE7F3;
  --blue:#3B82F6;--blue-light:#DBEAFE;
  --red:#EF4444;--red-light:#FEE2E2;
  --bg:#F0F2F8;--card:#FFFFFF;
  --text:#1A1A2E;--muted:#6B7280;--border:#E5E7EB;
  --shadow:0 2px 8px rgba(0,0,0,0.07);
  --shadow-lg:0 8px 24px rgba(0,0,0,0.12);
  --radius:16px;--radius-sm:10px;--nav-h:70px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
#root{height:100%;display:flex;flex-direction:column;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.page{flex:1;overflow-y:auto;padding-bottom:calc(var(--nav-h) + 16px);}
.container{max-width:480px;margin:0 auto;padding:0 16px;}
.flex{display:flex;align-items:center;}
.flex-col{display:flex;flex-direction:column;}
.between{justify-content:space-between;}
.wrap{flex-wrap:wrap;}
.gap-4{gap:4px;}.gap-8{gap:8px;}.gap-12{gap:12px;}.gap-16{gap:16px;}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;}
.card-sm{padding:12px;}
.btn{border:none;border-radius:12px;font-family:inherit;font-weight:600;cursor:pointer;transition:all 0.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;font-size:14px;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--primary);color:white;}
.btn-ghost{background:transparent;color:var(--text);border:1.5px solid var(--border);}
.btn-danger{background:var(--red-light);color:var(--red);}
.btn-sm{padding:7px 14px;font-size:13px;border-radius:10px;}
.btn-lg{padding:14px 24px;font-size:16px;border-radius:14px;}
.btn-full{width:100%;}
.btn-icon{padding:6px;border-radius:8px;background:var(--bg);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.btn-fab{width:54px;height:54px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,0.25);transition:all 0.15s;}
.btn-fab:active{transform:scale(0.93);}
.input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:15px;color:var(--text);background:var(--card);transition:border-color 0.15s;outline:none;}
.input:focus{border-color:var(--primary);}
.input-sm{padding:8px 12px;font-size:13px;border-radius:8px;}
textarea.input{resize:vertical;min-height:80px;}
select.input{cursor:pointer;}
.input-group{display:flex;flex-direction:column;gap:5px;}
.label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.chip{display:inline-flex;align-items:center;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:none;white-space:nowrap;}
.progress-track{background:var(--border);border-radius:20px;overflow:hidden;}
.progress-bar{height:100%;border-radius:20px;transition:width 0.6s ease;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);}
.modal{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:480px;padding:20px 20px 32px;max-height:88vh;overflow-y:auto;}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px;}
.toggle-group{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:2px;}
.toggle-btn{flex:1;padding:8px;border:none;background:transparent;border-radius:9px;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);transition:all 0.15s;}
.toggle-btn.active{background:var(--card);color:var(--text);font-weight:600;box-shadow:var(--shadow);}
.list-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
.section-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px;}
.empty{text-align:center;padding:48px 20px;color:var(--muted);}
.empty-icon{font-size:48px;margin-bottom:12px;}
.checkbox{width:22px;height:22px;border-radius:7px;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s;}
.checkbox.checked{border-color:transparent;}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);z-index:50;padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 6px);}
.nav-inner{max-width:480px;margin:0 auto;display:flex;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;cursor:pointer;border:none;background:none;font-family:inherit;color:var(--muted);font-size:10px;font-weight:500;transition:color 0.15s;}
.nav-dot{width:4px;height:4px;border-radius:50%;}
.toast{position:fixed;bottom:calc(var(--nav-h) + 20px);left:50%;transform:translateX(-50%);background:#1A1A2E;color:white;padding:10px 20px;border-radius:40px;font-size:13px;font-weight:600;z-index:200;white-space:nowrap;pointer-events:none;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.slide-up{animation:slideUp 0.32s cubic-bezier(0.22,1,0.36,1);}
.fade-in{animation:fadeIn 0.25s ease;}
input[type=range]{width:100%;accent-color:var(--primary);}
input[type=date]{color-scheme:light;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;

// ─── Storage ─────────────────────────────────────────────────────────
const DB={
  get:(k,def)=>{try{const v=localStorage.getItem('mv_'+k);return v!=null?JSON.parse(v):def;}catch{return def;}},
  set:(k,v)=>{try{localStorage.setItem('mv_'+k,JSON.stringify(v));}catch{}}
};

// ─── Helpers ─────────────────────────────────────────────────────────
const today=()=>new Date().toISOString().split('T')[0];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtBRL=(n)=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n||0);
const fmtDate=(d)=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}):'';
const fmtDateFull=(d)=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'}):'';
const getLast7=()=>{const a=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push(d.toISOString().split('T')[0]);}return a;};
const getLast14=()=>{const a=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push(d.toISOString().split('T')[0]);}return a;};
const dayShort=(d)=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short'}).slice(0,3);
const greeting=()=>{const h=new Date().getHours();return h<5?'Boa madrugada':h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';};

// ─── Constants ────────────────────────────────────────────────────────
const EXPENSE_CATS=[
  {id:'moradia',label:'Moradia',icon:'🏠',color:'#6C63FF'},
  {id:'alimentacao',label:'Alimentação',icon:'🍔',color:'#F59E0B'},
  {id:'transporte',label:'Transporte',icon:'🚗',color:'#3B82F6'},
  {id:'saude',label:'Saúde',icon:'💊',color:'#10B981'},
  {id:'lazer',label:'Lazer',icon:'🎮',color:'#EC4899'},
  {id:'roupas',label:'Roupas',icon:'👗',color:'#8B5CF6'},
  {id:'educacao',label:'Educação',icon:'📚',color:'#06B6D4'},
  {id:'assinaturas',label:'Assinaturas',icon:'📱',color:'#F97316'},
  {id:'outros',label:'Outros',icon:'💸',color:'#6B7280'},
];
const INCOME_CATS=[
  {id:'salario',label:'Salário',icon:'💼',color:'#10B981'},
  {id:'freelance',label:'Freelance',icon:'💻',color:'#06B6D4'},
  {id:'investimentos',label:'Investimentos',icon:'📈',color:'#F59E0B'},
  {id:'presente',label:'Presente/Extra',icon:'🎁',color:'#EC4899'},
  {id:'outros',label:'Outros',icon:'💰',color:'#6B7280'},
];
const GOAL_CATS=[
  {id:'saude',label:'Saúde',color:'#10B981'},
  {id:'financeiro',label:'Financeiro',color:'#F59E0B'},
  {id:'pessoal',label:'Pessoal',color:'#7C3AED'},
  {id:'carreira',label:'Carreira',color:'#3B82F6'},
  {id:'relacoes',label:'Relações',color:'#EC4899'},
];
const DEFAULT_HABITS=[
  {id:'water',name:'Beber água (2L)',icon:'💧',color:'#3B82F6'},
  {id:'exercise',name:'Exercitar-se',icon:'🏃',color:'#10B981'},
  {id:'sleep',name:'Dormir bem',icon:'😴',color:'#7C3AED'},
  {id:'meditation',name:'Meditar',icon:'🧘',color:'#EC4899'},
];
const MOODS=[
  {val:1,emoji:'😔',label:'Péssimo'},
  {val:2,emoji:'😕',label:'Ruim'},
  {val:3,emoji:'😐',label:'Ok'},
  {val:4,emoji:'😊',label:'Bem'},
  {val:5,emoji:'😄',label:'Ótimo'},
];
const QUOTES=[
  "Cada dia é uma nova oportunidade de recomeçar.",
  "Pequenos passos todos os dias levam a grandes mudanças.",
  "Cuide de você como cuidaria de alguém que ama.",
  "O progresso não precisa ser perfeito, precisa ser consistente.",
  "Você é mais forte do que imagina.",
  "Um dia de cada vez. Só isso.",
  "Sua saúde mental importa tanto quanto a física.",
  "Economizar é um ato de amor pelo seu eu futuro.",
  "Celebre suas pequenas vitórias de hoje.",
  "A organização é a porta para a paz mental.",
  "Você não precisa ser perfeita, precisa ser real.",
  "Cada escolha saudável é uma vitória.",
  "Confie no seu processo.",
  "A jornada de mil quilômetros começa com um passo.",
];
const EMOJI_HABIT=['💧','🏃','😴','🧘','🍎','💊','📚','🧹','🎯','💪','🌿','☀️','⭐','🎨','🎵','🫁','🦷','🌙','📝','🏋'];
const COLORS_HABIT=['#7C3AED','#10B981','#3B82F6','#F59E0B','#EC4899','#EF4444','#06B6D4','#F97316'];

// ─── Data ─────────────────────────────────────────────────────────────
const initData=()=>({
  profile:DB.get('profile',{name:'',done:false}),
  transactions:DB.get('transactions',[]),
  savingsGoals:DB.get('savingsGoals',[]),
  habits:DB.get('habits',DEFAULT_HABITS),
  habitLogs:DB.get('habitLogs',{}),
  moodLogs:DB.get('moodLogs',{}),
  journalEntries:DB.get('journalEntries',[]),
  goals:DB.get('goals',[]),
});
const persist=(data)=>{
  DB.set('profile',data.profile);
  DB.set('transactions',data.transactions);
  DB.set('savingsGoals',data.savingsGoals);
  DB.set('habits',data.habits);
  DB.set('habitLogs',data.habitLogs);
  DB.set('moodLogs',data.moodLogs);
  DB.set('journalEntries',data.journalEntries);
  DB.set('goals',data.goals);
};
const save=(setData,updater)=>{
  setData(prev=>{const next=updater(prev);persist(next);return next;});
};

// ─── UI Primitives ────────────────────────────────────────────────────
const ProgressBar=({value,max,color='var(--primary)',height=7})=>{
  const pct=Math.min(100,Math.round((value/(max||1))*100));
  return <div className="progress-track" style={{height}}><div className="progress-bar" style={{width:`${pct}%`,background:color,height:'100%'}}/></div>;
};
const Checkbox=({checked,onChange,color='var(--primary)'})=>(
  <div className={`checkbox${checked?' checked':''}`} onClick={onChange}
    style={checked?{background:color}:{}}>
    {checked&&<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5"/></svg>}
  </div>
);
const Modal=({open,onClose,title,children})=>{
  if(!open)return null;
  return(
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal slide-up">
        <div className="modal-handle"/>
        {title&&<div className="flex between" style={{marginBottom:16}}>
          <span style={{fontSize:17,fontWeight:800}}>{title}</span>
          <button className="btn-icon" onClick={onClose}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" strokeWidth="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>}
        {children}
      </div>
    </div>
  );
};
const IcoTrash=()=><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>;

// ─── Setup ────────────────────────────────────────────────────────────
const Setup=({onDone})=>{
  const [name,setName]=useState('');
  return(
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'32px 24px',background:'linear-gradient(150deg,#7C3AED 0%,#3B82F6 100%)'}}>
      <div style={{fontSize:72,marginBottom:12}}>✨</div>
      <h1 style={{color:'white',fontSize:28,fontWeight:800,textAlign:'center',marginBottom:8,lineHeight:1.2}}>Bem-vinda ao<br/>MasterVida</h1>
      <p style={{color:'rgba(255,255,255,0.85)',textAlign:'center',marginBottom:40,fontSize:15,lineHeight:1.7,maxWidth:300}}>
        Seu espaço pessoal para organizar finanças, saúde e bem-estar emocional — um dia de cada vez.
      </p>
      <div style={{width:'100%',maxWidth:340}}>
        <label style={{fontSize:13,fontWeight:600,color:'rgba(255,255,255,0.8)',display:'block',marginBottom:8}}>Como posso te chamar?</label>
        <input
          className="input"
          placeholder="Seu nome ou apelido"
          value={name}
          onChange={e=>setName(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&name.trim()&&onDone(name.trim())}
          autoFocus
          style={{fontSize:16,padding:'14px 16px',marginBottom:14}}
        />
        <button
          className="btn btn-full btn-lg"
          style={{background:name.trim()?'white':'rgba(255,255,255,0.5)',color:'#7C3AED',fontWeight:800,fontSize:16}}
          onClick={()=>name.trim()&&onDone(name.trim())}
        >
          Começar minha jornada →
        </button>
      </div>
      <p style={{color:'rgba(255,255,255,0.5)',fontSize:11,marginTop:32,textAlign:'center'}}>
        Todos os dados ficam somente no seu dispositivo.
      </p>
    </div>
  );
};

// ─── Dashboard ────────────────────────────────────────────────────────
const Dashboard=({data,setData,setPage})=>{
  const td=today();
  const quote=QUOTES[new Date().getDay()%QUOTES.length];
  const thisMonth=td.slice(0,7);
  const monthTx=data.transactions.filter(t=>t.date.startsWith(thisMonth));
  const income=monthTx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expenses=monthTx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const balance=income-expenses;
  const todayLog=data.habitLogs[td]||{};
  const habitsDone=data.habits.filter(h=>todayLog[h.id]).length;
  const habitsTotal=data.habits.length;
  const todayMood=data.moodLogs[td];
  const moodObj=todayMood?MOODS.find(m=>m.val===todayMood.mood):null;
  const activeGoals=data.goals.filter(g=>g.progress<100).slice(0,2);
  const recentTx=[...data.transactions].reverse().slice(0,4);

  const quickMood=(val)=>save(setData,d=>({...d,moodLogs:{...d.moodLogs,[td]:{...(d.moodLogs[td]||{}),mood:val}}}));
  const toggleHabit=(hid)=>save(setData,d=>{
    const log={...d.habitLogs};
    if(!log[td])log[td]={};
    log[td]={...log[td],[hid]:!log[td][hid]};
    return {...d,habitLogs:log};
  });

  return(
    <div className="page">
      <div style={{background:'linear-gradient(150deg,#7C3AED 0%,#5B21B6 100%)',padding:'28px 16px 36px'}}>
        <div style={{maxWidth:480,margin:'0 auto'}}>
          <div className="flex between">
            <div>
              <div style={{fontSize:13,color:'rgba(255,255,255,0.75)',fontWeight:500,marginBottom:3}}>{greeting()}, {data.profile.name} 👋</div>
              <div style={{fontSize:22,color:'white',fontWeight:800,lineHeight:1.2}}>Como você está hoje?</div>
            </div>
            <div style={{fontSize:40}}>{moodObj?moodObj.emoji:'🌟'}</div>
          </div>
        </div>
      </div>

      <div className="container" style={{paddingTop:20}}>
        {/* Quick mood */}
        {!todayMood&&(
          <div className="card fade-in" style={{marginBottom:14,border:'1.5px solid var(--primary-light)',background:'var(--primary-light)'}}>
            <div style={{fontSize:13,fontWeight:700,color:'var(--primary)',marginBottom:10}}>✨ Registre seu humor de hoje</div>
            <div className="flex" style={{justifyContent:'space-around'}}>
              {MOODS.map(m=>(
                <button key={m.val} title={m.label} onClick={()=>quickMood(m.val)}
                  style={{border:'none',background:'none',cursor:'pointer',fontSize:32,padding:'6px 8px',borderRadius:10,transition:'transform 0.15s'}}
                  onMouseOver={e=>e.target.style.transform='scale(1.2)'} onMouseOut={e=>e.target.style.transform='scale(1)'}>
                  {m.emoji}
                </button>
              ))}
            </div>
          </div>
        )}

        {/* Stats row */}
        <div className="flex gap-12" style={{marginBottom:14}}>
          <div className="card" style={{flex:1,cursor:'pointer'}} onClick={()=>setPage('finance')}>
            <div style={{fontSize:10,color:'var(--muted)',fontWeight:700,marginBottom:4,textTransform:'uppercase',letterSpacing:.5}}>Saldo do mês</div>
            <div style={{fontSize:19,fontWeight:800,color:balance>=0?'var(--green)':'var(--red)',marginBottom:2}}>{fmtBRL(balance)}</div>
            <div style={{fontSize:10,color:'var(--muted)'}}>↑{fmtBRL(income)} ↓{fmtBRL(expenses)}</div>
          </div>
          <div className="card" style={{flex:1,cursor:'pointer'}} onClick={()=>setPage('health')}>
            <div style={{fontSize:10,color:'var(--muted)',fontWeight:700,marginBottom:4,textTransform:'uppercase',letterSpacing:.5}}>Hábitos hoje</div>
            <div style={{fontSize:19,fontWeight:800,marginBottom:6}}>{habitsDone}/{habitsTotal}</div>
            <ProgressBar value={habitsDone} max={habitsTotal||1} color="var(--green)" height={5}/>
          </div>
        </div>

        {/* Quote */}
        <div className="card" style={{marginBottom:14,background:'linear-gradient(135deg,#7C3AED08,#3B82F608)',border:'1px solid var(--primary-light)'}}>
          <div style={{fontSize:13,color:'var(--primary)',fontWeight:500,lineHeight:1.7}}>💜 <em>"{quote}"</em></div>
        </div>

        {/* Habits today */}
        {data.habits.length>0&&(
          <div style={{marginBottom:14}}>
            <div className="section-title">Hábitos de hoje</div>
            <div className="card card-sm">
              {data.habits.map(h=>{
                const done=!!todayLog[h.id];
                return(
                  <div key={h.id} className="list-item">
                    <div style={{fontSize:22}}>{h.icon}</div>
                    <div style={{flex:1,fontSize:14,fontWeight:500,color:done?'var(--muted)':'var(--text)',textDecoration:done?'line-through':''}}>{h.name}</div>
                    <Checkbox checked={done} onChange={()=>toggleHabit(h.id)} color={h.color}/>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* Goals */}
        {activeGoals.length>0&&(
          <div style={{marginBottom:14}}>
            <div className="flex between" style={{marginBottom:10}}>
              <span className="section-title" style={{margin:0}}>Metas em andamento</span>
              <button className="btn btn-sm btn-ghost" onClick={()=>setPage('goals')}>Ver todas</button>
            </div>
            <div className="flex-col gap-8">
              {activeGoals.map(g=>{
                const cat=GOAL_CATS.find(c=>c.id===g.category)||GOAL_CATS[2];
                return(
                  <div className="card card-sm" key={g.id}>
                    <div className="flex between" style={{marginBottom:7}}>
                      <span style={{fontSize:14,fontWeight:700}}>{g.title}</span>
                      <span className="badge" style={{background:cat.color+'20',color:cat.color}}>{g.progress}%</span>
                    </div>
                    <ProgressBar value={g.progress} max={100} color={cat.color}/>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* Recent transactions */}
        {recentTx.length>0&&(
          <div style={{marginBottom:14}}>
            <div className="flex between" style={{marginBottom:10}}>
              <span className="section-title" style={{margin:0}}>Transações recentes</span>
              <button className="btn btn-sm btn-ghost" onClick={()=>setPage('finance')}>Ver todas</button>
            </div>
            <div className="card card-sm">
              {recentTx.map(t=>{
                const cats=t.type==='income'?INCOME_CATS:EXPENSE_CATS;
                const cat=cats.find(c=>c.id===t.category)||cats[cats.length-1];
                return(
                  <div key={t.id} className="list-item">
                    <div style={{width:36,height:36,borderRadius:10,background:cat.color+'20',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,flexShrink:0}}>{cat.icon}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:13,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.description||cat.label}</div>
                      <div style={{fontSize:11,color:'var(--muted)'}}>{fmtDate(t.date)}</div>
                    </div>
                    <div style={{fontSize:14,fontWeight:700,color:t.type==='income'?'var(--green)':'var(--red)',flexShrink:0}}>
                      {t.type==='income'?'+':'-'}{fmtBRL(t.amount)}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {data.transactions.length===0&&data.habits.length===0&&data.goals.length===0&&(
          <div className="empty">
            <div className="empty-icon">🌱</div>
            <div style={{fontSize:15,fontWeight:700,marginBottom:8,color:'var(--text)'}}>Sua jornada começa aqui!</div>
            <div style={{fontSize:13}}>Use as abas abaixo para registrar gastos, hábitos, metas e seu bem-estar.</div>
          </div>
        )}
      </div>
    </div>
  );
};

// ─── Finance ──────────────────────────────────────────────────────────
const Finance=({data,setData,showToast})=>{
  const [showAdd,setShowAdd]=useState(false);
  const [tab,setTab]=useState('expense');
  const [form,setForm]=useState({amount:'',category:'alimentacao',description:'',date:today()});
  const [filter,setFilter]=useState('month');
  const [showGoal,setShowGoal]=useState(false);
  const [goalForm,setGoalForm]=useState({name:'',target:'',current:'0',deadline:''});
  const [confirmDel,setConfirmDel]=useState(null);
  const [goalCurrents,setGoalCurrents]=useState({});

  const td=today();
  const thisMonth=td.slice(0,7);
  const txFiltered=filter==='month'
    ?data.transactions.filter(t=>t.date.startsWith(thisMonth))
    :data.transactions;

  const income=txFiltered.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expenses=txFiltered.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const balance=income-expenses;

  const expenseCats=EXPENSE_CATS
    .map(c=>({...c,total:txFiltered.filter(t=>t.type==='expense'&&t.category===c.id).reduce((s,t)=>s+t.amount,0)}))
    .filter(c=>c.total>0).sort((a,b)=>b.total-a.total);

  const addTx=()=>{
    if(!form.amount||isNaN(+form.amount)||+form.amount<=0)return;
    const tx={id:uid(),type:tab,amount:parseFloat(form.amount),category:form.category,description:form.description.trim(),date:form.date||td};
    save(setData,d=>({...d,transactions:[...d.transactions,tx]}));
    setShowAdd(false);setForm({amount:'',category:tab==='expense'?'alimentacao':'salario',description:'',date:td});
    showToast(tab==='expense'?'Despesa adicionada ✓':'Receita adicionada ✓');
  };

  const deleteTx=(id)=>{
    save(setData,d=>({...d,transactions:d.transactions.filter(t=>t.id!==id)}));
    setConfirmDel(null);showToast('Transação removida');
  };

  const addGoal=()=>{
    if(!goalForm.name.trim()||!goalForm.target||+goalForm.target<=0)return;
    const g={id:uid(),name:goalForm.name.trim(),target:parseFloat(goalForm.target),current:parseFloat(goalForm.current)||0,deadline:goalForm.deadline};
    save(setData,d=>({...d,savingsGoals:[...d.savingsGoals,g]}));
    setShowGoal(false);setGoalForm({name:'',target:'',current:'0',deadline:''});
    showToast('Meta criada! 🎯');
  };

  const updateGoalCurrent=(id)=>{
    const val=parseFloat(goalCurrents[id]||0);
    save(setData,d=>({...d,savingsGoals:d.savingsGoals.map(g=>g.id===id?{...g,current:val}:g)}));
    showToast('Meta atualizada ✓');
  };

  const deleteGoal=(id)=>{
    save(setData,d=>({...d,savingsGoals:d.savingsGoals.filter(g=>g.id!==id)}));
  };

  const openAdd=(t)=>{
    setTab(t);setForm({amount:'',category:t==='expense'?'alimentacao':'salario',description:'',date:td});
    setShowAdd(true);
  };

  return(
    <div className="page">
      <div style={{background:'linear-gradient(150deg,#10B981 0%,#059669 100%)',padding:'28px 16px 36px'}}>
        <div style={{maxWidth:480,margin:'0 auto'}}>
          <div style={{fontSize:13,color:'rgba(255,255,255,0.8)',fontWeight:500,marginBottom:4}}>
            {filter==='month'?'Saldo — '+new Date().toLocaleDateString('pt-BR',{month:'long'}):'Saldo geral'}
          </div>
          <div style={{fontSize:36,fontWeight:800,color:'white',marginBottom:16}}>{fmtBRL(balance)}</div>
          <div className="flex gap-24">
            <div><div style={{fontSize:10,color:'rgba(255,255,255,0.7)',fontWeight:600,marginBottom:2}}>↑ RECEITAS</div><div style={{fontSize:18,fontWeight:700,color:'white'}}>{fmtBRL(income)}</div></div>
            <div style={{width:1,background:'rgba(255,255,255,0.25)',alignSelf:'stretch'}}/>
            <div><div style={{fontSize:10,color:'rgba(255,255,255,0.7)',fontWeight:600,marginBottom:2}}>↓ DESPESAS</div><div style={{fontSize:18,fontWeight:700,color:'white'}}>{fmtBRL(expenses)}</div></div>
          </div>
        </div>
      </div>

      <div className="container" style={{paddingTop:16}}>
        {/* Quick add buttons */}
        <div className="flex gap-8" style={{marginBottom:16}}>
          <button className="btn btn-full" style={{background:'var(--red-light)',color:'var(--red)'}} onClick={()=>openAdd('expense')}>+ Despesa</button>
          <button className="btn btn-full" style={{background:'var(--green-light)',color:'var(--green)'}} onClick={()=>openAdd('income')}>+ Receita</button>
        </div>

        {/* Filter */}
        <div className="toggle-group" style={{marginBottom:16}}>
          <button className={`toggle-btn${filter==='month'?' active':''}`} onClick={()=>setFilter('month')}>Este mês</button>
          <button className={`toggle-btn${filter==='all'?' active':''}`} onClick={()=>setFilter('all')}>Tudo</button>
        </div>

        {/* Category breakdown */}
        {expenseCats.length>0&&(
          <div className="card" style={{marginBottom:14}}>
            <div className="section-title">Gastos por categoria</div>
            <div className="flex-col gap-10">
              {expenseCats.map(c=>(
                <div key={c.id}>
                  <div className="flex between" style={{marginBottom:4}}>
                    <span style={{fontSize:13}}>{c.icon} {c.label}</span>
                    <span style={{fontSize:13,fontWeight:700}}>{fmtBRL(c.total)}</span>
                  </div>
                  <ProgressBar value={c.total} max={expenses||1} color={c.color} height={5}/>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Savings goals */}
        <div style={{marginBottom:14}}>
          <div className="flex between" style={{marginBottom:10}}>
            <span className="section-title" style={{margin:0}}>Metas de economia</span>
            <button className="btn btn-sm btn-ghost" onClick={()=>setShowGoal(true)}>+ Nova meta</button>
          </div>
          {data.savingsGoals.length===0?(
            <button className="btn btn-ghost btn-full" onClick={()=>setShowGoal(true)}>💰 Criar minha primeira meta de economia</button>
          ):(
            <div className="flex-col gap-10">
              {data.savingsGoals.map(g=>{
                const pct=Math.min(100,Math.round((g.current/g.target)*100)||0);
                const cur=goalCurrents[g.id]!==undefined?goalCurrents[g.id]:String(g.current);
                return(
                  <div className="card card-sm" key={g.id}>
                    <div className="flex between" style={{marginBottom:6}}>
                      <span style={{fontSize:15,fontWeight:700}}>{g.name}</span>
                      <button className="btn-icon" onClick={()=>deleteGoal(g.id)}><IcoTrash/></button>
                    </div>
                    <div className="flex between" style={{fontSize:12,color:'var(--muted)',marginBottom:7}}>
                      <span>{fmtBRL(g.current)} de {fmtBRL(g.target)}</span>
                      <span style={{fontWeight:700,color:'var(--green)'}}>{pct}%</span>
                    </div>
                    <ProgressBar value={g.current} max={g.target||1} color="var(--green)" height={6}/>
                    {g.deadline&&<div style={{fontSize:11,color:'var(--muted)',marginTop:6}}>📅 Prazo: {fmtDate(g.deadline)}</div>}
                    <div className="flex gap-8" style={{marginTop:10}}>
                      <input type="number" className="input input-sm" placeholder="Valor atual economizado"
                        value={cur} style={{flex:1}}
                        onChange={e=>setGoalCurrents(s=>({...s,[g.id]:e.target.value}))}
                      />
                      <button className="btn btn-primary btn-sm" onClick={()=>updateGoalCurrent(g.id)}>OK</button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>

        {/* Transactions */}
        <div className="section-title">Transações ({txFiltered.length})</div>
        {txFiltered.length===0?(
          <div className="empty" style={{padding:'32px 16px'}}>
            <div className="empty-icon">💸</div>
            <div style={{fontSize:14,fontWeight:600}}>Nenhuma transação ainda</div>
          </div>
        ):(
          <div className="card card-sm" style={{marginBottom:16}}>
            {[...txFiltered].reverse().map(t=>{
              const cats=t.type==='income'?INCOME_CATS:EXPENSE_CATS;
              const cat=cats.find(c=>c.id===t.category)||cats[cats.length-1];
              return(
                <div key={t.id} className="list-item">
                  <div style={{width:38,height:38,borderRadius:10,background:cat.color+'20',display:'flex',alignItems:'center',justifyContent:'center',fontSize:19,flexShrink:0}}>{cat.icon}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.description||cat.label}</div>
                    <div style={{fontSize:11,color:'var(--muted)'}}>{fmtDate(t.date)} · {cat.label}</div>
                  </div>
                  <div className="flex gap-8" style={{alignItems:'center',flexShrink:0}}>
                    <div style={{fontSize:14,fontWeight:700,color:t.type==='income'?'var(--green)':'var(--red)'}}>
                      {t.type==='income'?'+':'-'}{fmtBRL(t.amount)}
                    </div>
                    <button className="btn-icon" onClick={()=>setConfirmDel(t.id)}><IcoTrash/></button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* Add transaction modal */}
      <Modal open={showAdd} onClose={()=>setShowAdd(false)} title={tab==='expense'?'Nova despesa':'Nova receita'}>
        <div className="toggle-group" style={{marginBottom:16}}>
          <button className={`toggle-btn${tab==='expense'?' active':''}`} onClick={()=>{setTab('expense');setForm(f=>({...f,category:'alimentacao'}));}}>Despesa</button>
          <button className={`toggle-btn${tab==='income'?' active':''}`} onClick={()=>{setTab('income');setForm(f=>({...f,category:'salario'}));}}>Receita</button>
        </div>
        <div className="flex-col gap-12">
          <div className="input-group">
            <label className="label">Valor (R$)</label>
            <input className="input" type="number" inputMode="decimal" placeholder="0,00" value={form.amount} onChange={e=>setForm(f=>({...f,amount:e.target.value}))} autoFocus/>
          </div>
          <div className="input-group">
            <label className="label">Categoria</label>
            <select className="input" value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>
              {(tab==='expense'?EXPENSE_CATS:INCOME_CATS).map(c=><option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}
            </select>
          </div>
          <div className="input-group">
            <label className="label">Descrição (opcional)</label>
            <input className="input" placeholder="Ex: almoço no trabalho" value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))}/>
          </div>
          <div className="input-group">
            <label className="label">Data</label>
            <input className="input" type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/>
          </div>
          <button className="btn btn-full btn-lg" style={{background:tab==='expense'?'var(--red)':'var(--green)',color:'white'}} onClick={addTx}>
            Adicionar {tab==='expense'?'despesa':'receita'}
          </button>
        </div>
      </Modal>

      {/* Savings goal modal */}
      <Modal open={showGoal} onClose={()=>setShowGoal(false)} title="Nova meta de economia">
        <div className="flex-col gap-12">
          <div className="input-group"><label className="label">Nome da meta</label><input className="input" placeholder="Ex: Viagem, reserva de emergência" value={goalForm.name} onChange={e=>setGoalForm(f=>({...f,name:e.target.value}))}/></div>
          <div className="input-group"><label className="label">Valor alvo (R$)</label><input className="input" type="number" inputMode="decimal" placeholder="5000,00" value={goalForm.target} onChange={e=>setGoalForm(f=>({...f,target:e.target.value}))}/></div>
          <div className="input-group"><label className="label">Já tenho (R$)</label><input className="input" type="number" inputMode="decimal" placeholder="0,00" value={goalForm.current} onChange={e=>setGoalForm(f=>({...f,current:e.target.value}))}/></div>
          <div className="input-group"><label className="label">Prazo (opcional)</label><input className="input" type="date" value={goalForm.deadline} onChange={e=>setGoalForm(f=>({...f,deadline:e.target.value}))}/></div>
          <button className="btn btn-full btn-lg btn-primary" onClick={addGoal}>Criar meta</button>
        </div>
      </Modal>

      {/* Delete confirm */}
      <Modal open={!!confirmDel} onClose={()=>setConfirmDel(null)} title="Excluir transação?">
        <p style={{fontSize:14,color:'var(--muted)',marginBottom:20}}>Esta ação não pode ser desfeita.</p>
        <div className="flex gap-10">
          <button className="btn btn-ghost btn-full" onClick={()=>setConfirmDel(null)}>Cancelar</button>
          <button className="btn btn-danger btn-full" onClick={()=>deleteTx(confirmDel)}>Excluir</button>
        </div>
      </Modal>
    </div>
  );
};

// ─── Health ───────────────────────────────────────────────────────────
const Health=({data,setData,showToast})=>{
  const [activeTab,setActiveTab]=useState('today');
  const [showAddHabit,setShowAddHabit]=useState(false);
  const [habitForm,setHabitForm]=useState({name:'',icon:'⭐',color:'#7C3AED'});

  const td=today();
  const last14=getLast14();
  const todayLog=data.habitLogs[td]||{};

  const toggle=(hid)=>save(setData,d=>{
    const log={...d.habitLogs};
    if(!log[td])log[td]={};
    log[td]={...log[td],[hid]:!log[td][hid]};
    return {...d,habitLogs:log};
  });

  const addHabit=()=>{
    if(!habitForm.name.trim())return;
    const h={id:uid(),name:habitForm.name.trim(),icon:habitForm.icon,color:habitForm.color};
    save(setData,d=>({...d,habits:[...d.habits,h]}));
    setShowAddHabit(false);setHabitForm({name:'',icon:'⭐',color:'#7C3AED'});
    showToast('Hábito criado! 🌱');
  };

  const deleteHabit=(hid)=>{
    save(setData,d=>({...d,habits:d.habits.filter(h=>h.id!==hid)}));
  };

  const getStreak=(hid)=>{
    let s=0;
    for(const d of [...getLast14()].reverse()){
      if((data.habitLogs[d]||{})[hid])s++;else break;
    }
    return s;
  };

  const done=data.habits.filter(h=>todayLog[h.id]).length;

  return(
    <div className="page">
      <div style={{background:'linear-gradient(150deg,#F59E0B 0%,#D97706 100%)',padding:'28px 16px 36px'}}>
        <div style={{maxWidth:480,margin:'0 auto'}}>
          <div style={{fontSize:13,color:'rgba(255,255,255,0.8)',fontWeight:500}}>Saúde & Hábitos</div>
          <div style={{fontSize:24,color:'white',fontWeight:800,marginTop:3}}>Seus hábitos diários 🌿</div>
          {data.habits.length>0&&<div style={{fontSize:14,color:'rgba(255,255,255,0.9)',marginTop:6}}>{done}/{data.habits.length} concluídos hoje · {data.habits.filter(h=>getStreak(h.id)>0).length} em sequência 🔥</div>}
        </div>
      </div>

      <div className="container" style={{paddingTop:16}}>
        <div className="toggle-group" style={{marginBottom:16}}>
          <button className={`toggle-btn${activeTab==='today'?' active':''}`} onClick={()=>setActiveTab('today')}>Hoje</button>
          <button className={`toggle-btn${activeTab==='history'?' active':''}`} onClick={()=>setActiveTab('history')}>Histórico</button>
          <button className={`toggle-btn${activeTab==='manage'?' active':''}`} onClick={()=>setActiveTab('manage')}>Gerenciar</button>
        </div>

        {activeTab==='today'&&(
          <div className="fade-in">
            {data.habits.length===0?(
              <div className="empty">
                <div className="empty-icon">🌱</div>
                <div style={{fontSize:15,fontWeight:700,marginBottom:8,color:'var(--text)'}}>Nenhum hábito ainda</div>
                <div style={{fontSize:13,marginBottom:16}}>Crie hábitos para acompanhar seu progresso diário</div>
                <button className="btn btn-primary" onClick={()=>setActiveTab('manage')}>Criar hábito</button>
              </div>
            ):(
              <div className="flex-col gap-8">
                {data.habits.map(h=>{
                  const d=!!todayLog[h.id];
                  const streak=getStreak(h.id);
                  return(
                    <div key={h.id} className="card card-sm" style={{border:`1.5px solid ${d?h.color+'40':'transparent'}`,background:d?h.color+'06':'white'}}>
                      <div className="flex gap-12">
                        <div style={{fontSize:28}}>{h.icon}</div>
                        <div style={{flex:1}}>
                          <div style={{fontSize:15,fontWeight:600,color:d?h.color:'var(--text)',textDecoration:d?'line-through':''}}>{h.name}</div>
                          <div style={{fontSize:11,color:'var(--muted)',marginTop:2}}>
                            {streak>0?`🔥 ${streak} dia${streak!==1?'s':''} seguido${streak!==1?'s':''}`:d?'✓ Feito hoje!':'Não feito ainda'}
                          </div>
                        </div>
                        <Checkbox checked={d} onChange={()=>toggle(h.id)} color={h.color}/>
                      </div>
                    </div>
                  );
                })}
                {done===data.habits.length&&data.habits.length>0&&(
                  <div className="card" style={{textAlign:'center',background:'var(--green-light)',border:'1px solid #A7F3D0'}}>
                    <div style={{fontSize:32,marginBottom:4}}>🎉</div>
                    <div style={{fontSize:15,fontWeight:700,color:'var(--green)'}}>Todos os hábitos feitos!</div>
                    <div style={{fontSize:13,color:'var(--green)',marginTop:4,opacity:.8}}>Você arrasou hoje!</div>
                  </div>
                )}
              </div>
            )}
          </div>
        )}

        {activeTab==='history'&&(
          <div className="fade-in">
            {data.habits.length===0?(
              <div className="empty"><div className="empty-icon">📊</div><div style={{fontSize:14}}>Sem hábitos para mostrar</div></div>
            ):(
              data.habits.map(h=>(
                <div className="card" key={h.id} style={{marginBottom:12}}>
                  <div className="flex gap-8" style={{marginBottom:10}}>
                    <span style={{fontSize:20}}>{h.icon}</span>
                    <span style={{fontSize:14,fontWeight:700}}>{h.name}</span>
                    <span style={{marginLeft:'auto',fontSize:12,fontWeight:600,color:h.color}}>🔥 {getStreak(h.id)} dias</span>
                  </div>
                  <div className="flex gap-4 wrap">
                    {last14.map(d=>(
                      <div key={d} title={fmtDate(d)} style={{width:16,height:16,borderRadius:3,background:(data.habitLogs[d]||{})[h.id]?h.color:'var(--border)',flexShrink:0}}/>
                    ))}
                  </div>
                  <div className="flex between" style={{marginTop:5}}>
                    <span style={{fontSize:10,color:'var(--muted)'}}>14 dias atrás</span>
                    <span style={{fontSize:10,color:'var(--muted)'}}>hoje</span>
                  </div>
                </div>
              ))
            )}
          </div>
        )}

        {activeTab==='manage'&&(
          <div className="fade-in">
            <button className="btn btn-primary btn-full" style={{marginBottom:14}} onClick={()=>setShowAddHabit(true)}>+ Novo hábito</button>
            {data.habits.map(h=>(
              <div key={h.id} className="card card-sm flex between" style={{marginBottom:8}}>
                <div className="flex gap-12">
                  <span style={{fontSize:24}}>{h.icon}</span>
                  <div>
                    <div style={{fontSize:14,fontWeight:600}}>{h.name}</div>
                    <div style={{width:12,height:5,borderRadius:3,background:h.color,marginTop:4}}/>
                  </div>
                </div>
                <button className="btn-icon" style={{color:'var(--red)'}} onClick={()=>deleteHabit(h.id)}><IcoTrash/></button>
              </div>
            ))}
            {data.habits.length===0&&<div className="empty" style={{padding:'24px 0'}}><div style={{fontSize:14}}>Nenhum hábito cadastrado</div></div>}
          </div>
        )}
      </div>

      <Modal open={showAddHabit} onClose={()=>setShowAddHabit(false)} title="Novo hábito">
        <div className="flex-col gap-12">
          <div className="input-group">
            <label className="label">Nome do hábito</label>
            <input className="input" placeholder="Ex: Beber 2L de água" value={habitForm.name} onChange={e=>setHabitForm(f=>({...f,name:e.target.value}))} autoFocus/>
          </div>
          <div className="input-group">
            <label className="label">Emoji</label>
            <div className="flex gap-6 wrap">
              {EMOJI_HABIT.map(e=>(
                <button key={e} onClick={()=>setHabitForm(f=>({...f,icon:e}))}
                  style={{fontSize:22,padding:'6px',borderRadius:8,border:habitForm.icon===e?'2px solid var(--primary)':'2px solid transparent',background:habitForm.icon===e?'var(--primary-light)':'var(--bg)',cursor:'pointer'}}>
                  {e}
                </button>
              ))}
            </div>
          </div>
          <div className="input-group">
            <label className="label">Cor</label>
            <div className="flex gap-8">
              {COLORS_HABIT.map(c=>(
                <button key={c} onClick={()=>setHabitForm(f=>({...f,color:c}))}
                  style={{width:28,height:28,borderRadius:'50%',background:c,border:habitForm.color===c?'3px solid var(--text)':'3px solid transparent',cursor:'pointer',flexShrink:0}}/>
              ))}
            </div>
          </div>
          <div className="flex gap-10" style={{padding:'10px 14px',background:'var(--bg)',borderRadius:10}}>
            <span style={{fontSize:22}}>{habitForm.icon}</span>
            <span style={{fontSize:14,fontWeight:600}}>{habitForm.name||'Meu novo hábito'}</span>
            <div style={{width:10,height:10,borderRadius:'50%',background:habitForm.color,marginLeft:'auto',alignSelf:'center'}}/>
          </div>
          <button className="btn btn-primary btn-full btn-lg" onClick={addHabit}>Criar hábito</button>
        </div>
      </Modal>
    </div>
  );
};

// ─── Mind ─────────────────────────────────────────────────────────────
const Mind=({data,setData,showToast})=>{
  const [tab,setTab]=useState('today');
  const [gratitude,setGratitude]=useState(['','','']);
  const [dayNote,setDayNote]=useState('');
  const [showJournal,setShowJournal]=useState(false);
  const [journalText,setJournalText]=useState('');
  const [confirmDelJournal,setConfirmDelJournal]=useState(null);

  const td=today();
  const todayMood=data.moodLogs[td];

  useEffect(()=>{
    if(todayMood){
      setGratitude(todayMood.gratitude?.length?[...todayMood.gratitude,'','',''].slice(0,3):['','','']);
      setDayNote(todayMood.note||'');
    }
  },[td,!!todayMood]);

  const setMood=(val)=>{
    save(setData,d=>({...d,moodLogs:{...d.moodLogs,[td]:{...(d.moodLogs[td]||{}),mood:val}}}));
    showToast(MOODS.find(m=>m.val===val)?.emoji+' Humor registrado');
  };

  const saveToday=()=>{
    save(setData,d=>({...d,moodLogs:{...d.moodLogs,[td]:{...(d.moodLogs[td]||{}),gratitude:gratitude.filter(g=>g.trim()),note:dayNote}}}));
    showToast('Registro salvo! 💜');
  };

  const saveJournal=()=>{
    if(!journalText.trim())return;
    const entry={id:uid(),date:td,content:journalText.trim(),createdAt:new Date().toISOString()};
    save(setData,d=>({...d,journalEntries:[...d.journalEntries,entry]}));
    setJournalText('');setShowJournal(false);
    showToast('Entrada salva no diário 📖');
  };

  const deleteJournal=(id)=>{
    save(setData,d=>({...d,journalEntries:d.journalEntries.filter(e=>e.id!==id)}));
    setConfirmDelJournal(null);
  };

  const last7=getLast7();
  const moodHistory=last7.map(d=>({date:d,mood:data.moodLogs[d]?.mood||0}));

  return(
    <div className="page">
      <div style={{background:'linear-gradient(150deg,#EC4899 0%,#DB2777 100%)',padding:'28px 16px 36px'}}>
        <div style={{maxWidth:480,margin:'0 auto'}}>
          <div style={{fontSize:13,color:'rgba(255,255,255,0.8)',fontWeight:500}}>Bem-estar mental</div>
          <div style={{fontSize:24,color:'white',fontWeight:800,marginTop:3}}>Cuide da sua mente 💜</div>
          {todayMood&&<div style={{fontSize:30,marginTop:6}}>{MOODS.find(m=>m.val===todayMood.mood)?.emoji}</div>}
        </div>
      </div>

      <div className="container" style={{paddingTop:16}}>
        <div className="toggle-group" style={{marginBottom:16}}>
          <button className={`toggle-btn${tab==='today'?' active':''}`} onClick={()=>setTab('today')}>Hoje</button>
          <button className={`toggle-btn${tab==='history'?' active':''}`} onClick={()=>setTab('history')}>Histórico</button>
          <button className={`toggle-btn${tab==='journal'?' active':''}`} onClick={()=>setTab('journal')}>Diário</button>
        </div>

        {tab==='today'&&(
          <div className="fade-in">
            {/* Mood selector */}
            <div className="card" style={{marginBottom:14}}>
              <div style={{fontSize:14,fontWeight:700,marginBottom:12}}>Como você está se sentindo?</div>
              <div className="flex" style={{justifyContent:'space-around'}}>
                {MOODS.map(m=>(
                  <div key={m.val} style={{textAlign:'center'}}>
                    <button onClick={()=>setMood(m.val)}
                      style={{border:todayMood?.mood===m.val?'2.5px solid var(--pink)':'2.5px solid transparent',cursor:'pointer',fontSize:30,padding:'7px 9px',borderRadius:14,background:todayMood?.mood===m.val?'var(--pink-light)':'transparent',display:'block',transition:'all 0.2s',transform:todayMood?.mood===m.val?'scale(1.12)':'scale(1)'}}>
                      {m.emoji}
                    </button>
                    <div style={{fontSize:9,color:'var(--muted)',marginTop:3}}>{m.label}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Gratitude */}
            <div className="card" style={{marginBottom:14}}>
              <div style={{fontSize:14,fontWeight:700,marginBottom:12}}>🙏 3 coisas boas de hoje</div>
              <div className="flex-col gap-8">
                {[0,1,2].map(i=>(
                  <div key={i} className="flex gap-8" style={{alignItems:'center'}}>
                    <span style={{fontSize:15,color:'var(--muted)',minWidth:18,textAlign:'center',fontWeight:700}}>{i+1}.</span>
                    <input className="input input-sm" style={{flex:1}}
                      placeholder={['Minha saúde','Família e amigos','Um momento bonito hoje'][i]}
                      value={gratitude[i]}
                      onChange={e=>{const g=[...gratitude];g[i]=e.target.value;setGratitude(g);}}
                    />
                  </div>
                ))}
              </div>
            </div>

            {/* Day note */}
            <div className="card" style={{marginBottom:14}}>
              <div style={{fontSize:14,fontWeight:700,marginBottom:12}}>📝 Como foi seu dia?</div>
              <textarea className="input" placeholder="Escreva livremente sobre seus sentimentos, o que aconteceu hoje..." value={dayNote} onChange={e=>setDayNote(e.target.value)} style={{minHeight:90}}/>
            </div>

            <button className="btn btn-full btn-lg" style={{background:'var(--pink)',color:'white',marginBottom:14}} onClick={saveToday}>
              Salvar registro do dia
            </button>

            {todayMood?.gratitude?.filter(g=>g).length>0&&(
              <div className="card" style={{background:'var(--pink-light)',border:'1px solid #FBCFE8'}}>
                <div style={{fontSize:12,fontWeight:700,color:'var(--pink)',marginBottom:8}}>✨ Suas gratidões registradas</div>
                {todayMood.gratitude.map((g,i)=><div key={i} style={{fontSize:13,padding:'3px 0'}}>• {g}</div>)}
              </div>
            )}
          </div>
        )}

        {tab==='history'&&(
          <div className="fade-in">
            <div className="card" style={{marginBottom:16}}>
              <div style={{fontSize:14,fontWeight:700,marginBottom:16}}>Humor — últimos 7 dias</div>
              <div className="flex gap-6" style={{alignItems:'flex-end'}}>
                {moodHistory.map(({date,mood})=>(
                  <div key={date} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center'}}>
                    <div style={{fontSize:14,marginBottom:4}}>{mood?MOODS.find(m=>m.val===mood)?.emoji:''}</div>
                    <div style={{width:'100%',height:mood?`${(mood/5)*56}px`:'4px',background:mood?'var(--pink)':'var(--border)',borderRadius:'4px 4px 0 0',transition:'height 0.5s'}}/>
                    <div style={{fontSize:9,color:'var(--muted)',marginTop:4}}>{dayShort(date)}</div>
                  </div>
                ))}
              </div>
            </div>

            <div className="section-title">Registros anteriores</div>
            {Object.entries(data.moodLogs).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,15).map(([date,log])=>(
              <div key={date} className="card card-sm" style={{marginBottom:8}}>
                <div className="flex between" style={{marginBottom:log.note||(log.gratitude?.filter(g=>g).length>0)?8:0}}>
                  <span style={{fontSize:12,color:'var(--muted)'}}>{fmtDateFull(date)}</span>
                  <span style={{fontSize:24}}>{MOODS.find(m=>m.val===log.mood)?.emoji||'—'}</span>
                </div>
                {log.note&&<p style={{fontSize:13,lineHeight:1.6,marginBottom:6}}>{log.note}</p>}
                {log.gratitude?.filter(g=>g).map((g,i)=><div key={i} style={{fontSize:12,color:'var(--muted)'}}>🙏 {g}</div>)}
              </div>
            ))}
            {Object.keys(data.moodLogs).length===0&&(
              <div className="empty"><div className="empty-icon">📈</div><div>Nenhum registro ainda</div></div>
            )}
          </div>
        )}

        {tab==='journal'&&(
          <div className="fade-in">
            <button className="btn btn-full" style={{background:'var(--pink)',color:'white',marginBottom:14}} onClick={()=>setShowJournal(true)}>
              + Nova entrada no diário
            </button>
            {data.journalEntries.length===0?(
              <div className="empty">
                <div className="empty-icon">📖</div>
                <div style={{fontSize:15,fontWeight:700,marginBottom:8,color:'var(--text)'}}>Seu diário está vazio</div>
                <div style={{fontSize:13}}>Escrever sobre seus pensamentos ajuda a processar emoções e ganhar clareza.</div>
              </div>
            ):(
              <div className="flex-col gap-8">
                {[...data.journalEntries].reverse().map(e=>(
                  <div key={e.id} className="card card-sm">
                    <div className="flex between" style={{marginBottom:8}}>
                      <span style={{fontSize:12,color:'var(--muted)'}}>{fmtDateFull(e.date)}</span>
                      <button className="btn-icon" onClick={()=>setConfirmDelJournal(e.id)}><IcoTrash/></button>
                    </div>
                    <p style={{fontSize:14,lineHeight:1.7,color:'var(--text)'}}>{e.content}</p>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </div>

      <Modal open={showJournal} onClose={()=>setShowJournal(false)} title="Nova entrada no diário">
        <div style={{fontSize:12,color:'var(--muted)',marginBottom:12}}>{fmtDateFull(td)}</div>
        <textarea className="input" placeholder="O que está na sua mente? Escreva livremente, sem julgamentos..." value={journalText} onChange={e=>setJournalText(e.target.value)} style={{minHeight:200}} autoFocus/>
        <button className="btn btn-full btn-lg" style={{background:'var(--pink)',color:'white',marginTop:14}} onClick={saveJournal}>Salvar no diário</button>
      </Modal>

      <Modal open={!!confirmDelJournal} onClose={()=>setConfirmDelJournal(null)} title="Excluir entrada?">
        <p style={{fontSize:14,color:'var(--muted)',marginBottom:20}}>Esta ação não pode ser desfeita.</p>
        <div className="flex gap-10"><button className="btn btn-ghost btn-full" onClick={()=>setConfirmDelJournal(null)}>Cancelar</button><button className="btn btn-danger btn-full" onClick={()=>deleteJournal(confirmDelJournal)}>Excluir</button></div>
      </Modal>
    </div>
  );
};

// ─── Goals ────────────────────────────────────────────────────────────
const Goals=({data,setData,showToast})=>{
  const [showAdd,setShowAdd]=useState(false);
  const [form,setForm]=useState({title:'',description:'',category:'pessoal',targetDate:'',progress:0});
  const [filterCat,setFilterCat]=useState('all');
  const [confirmDel,setConfirmDel]=useState(null);

  const addGoal=()=>{
    if(!form.title.trim())return;
    const g={id:uid(),...form,progress:parseInt(form.progress)||0,createdAt:today()};
    save(setData,d=>({...d,goals:[...d.goals,g]}));
    setShowAdd(false);setForm({title:'',description:'',category:'pessoal',targetDate:'',progress:0});
    showToast('Meta criada! 🎯');
  };

  const updateProgress=(id,val)=>save(setData,d=>({...d,goals:d.goals.map(g=>g.id===id?{...g,progress:parseInt(val)||0}:g)}));
  const deleteGoal=(id)=>{save(setData,d=>({...d,goals:d.goals.filter(g=>g.id!==id)}));setConfirmDel(null);};

  const filtered=filterCat==='all'?data.goals:data.goals.filter(g=>g.category===filterCat);
  const active=filtered.filter(g=>g.progress<100);
  const done=filtered.filter(g=>g.progress===100);
  const totalDone=data.goals.filter(g=>g.progress===100).length;

  return(
    <div className="page">
      <div style={{background:'linear-gradient(150deg,#3B82F6 0%,#2563EB 100%)',padding:'28px 16px 36px'}}>
        <div style={{maxWidth:480,margin:'0 auto'}}>
          <div style={{fontSize:13,color:'rgba(255,255,255,0.8)',fontWeight:500}}>Metas & objetivos</div>
          <div style={{fontSize:24,color:'white',fontWeight:800,marginTop:3}}>Suas conquistas 🎯</div>
          <div style={{fontSize:13,color:'rgba(255,255,255,0.85)',marginTop:6}}>
            {totalDone} concluída{totalDone!==1?'s':''} · {data.goals.filter(g=>g.progress<100).length} em andamento
          </div>
        </div>
      </div>

      <div className="container" style={{paddingTop:16}}>
        {/* Category filter */}
        <div className="flex gap-8" style={{overflowX:'auto',paddingBottom:6,marginBottom:14,flexWrap:'nowrap'}}>
          <button className="chip" style={{background:filterCat==='all'?'var(--blue)':'var(--bg)',color:filterCat==='all'?'white':'var(--muted)'}} onClick={()=>setFilterCat('all')}>Todas</button>
          {GOAL_CATS.map(c=>(
            <button key={c.id} className="chip" style={{background:filterCat===c.id?c.color:'var(--bg)',color:filterCat===c.id?'white':'var(--muted)'}} onClick={()=>setFilterCat(c.id)}>{c.label}</button>
          ))}
        </div>

        <button className="btn btn-full" style={{background:'var(--blue)',color:'white',marginBottom:16}} onClick={()=>setShowAdd(true)}>+ Nova meta</button>

        {active.length>0&&(
          <>
            <div className="section-title">Em andamento ({active.length})</div>
            <div className="flex-col gap-12" style={{marginBottom:16}}>
              {active.map(g=>{
                const cat=GOAL_CATS.find(c=>c.id===g.category)||GOAL_CATS[2];
                return(
                  <div key={g.id} className="card">
                    <div className="flex between" style={{marginBottom:6}}>
                      <div style={{flex:1,paddingRight:8}}>
                        <div style={{fontSize:16,fontWeight:700}}>{g.title}</div>
                        {g.description&&<div style={{fontSize:13,color:'var(--muted)',marginTop:2,lineHeight:1.5}}>{g.description}</div>}
                      </div>
                      <button className="btn-icon" onClick={()=>setConfirmDel(g.id)}><IcoTrash/></button>
                    </div>
                    <div className="flex gap-8" style={{marginBottom:10,flexWrap:'wrap'}}>
                      <span className="badge" style={{background:cat.color+'20',color:cat.color}}>{cat.label}</span>
                      {g.targetDate&&<span style={{fontSize:11,color:'var(--muted)',display:'flex',alignItems:'center',gap:3}}>📅 {fmtDate(g.targetDate)}</span>}
                    </div>
                    <ProgressBar value={g.progress} max={100} color={cat.color} height={8}/>
                    <div className="flex between" style={{marginTop:10,gap:12,alignItems:'center'}}>
                      <input type="range" min="0" max="100" step="5" value={g.progress} onChange={e=>updateProgress(g.id,e.target.value)} style={{flex:1}}/>
                      <span style={{fontSize:15,fontWeight:800,color:cat.color,minWidth:40}}>{g.progress}%</span>
                    </div>
                    {g.progress===100&&<div style={{fontSize:13,color:'var(--green)',fontWeight:600,marginTop:6,textAlign:'center'}}>🎉 Meta concluída!</div>}
                  </div>
                );
              })}
            </div>
          </>
        )}

        {done.length>0&&(
          <>
            <div className="section-title">Concluídas 🎉 ({done.length})</div>
            <div className="flex-col gap-8" style={{marginBottom:16}}>
              {done.map(g=>{
                const cat=GOAL_CATS.find(c=>c.id===g.category)||GOAL_CATS[2];
                return(
                  <div key={g.id} className="card card-sm" style={{opacity:.7}}>
                    <div className="flex between">
                      <div className="flex gap-8">
                        <span style={{fontSize:18}}>✅</span>
                        <div>
                          <div style={{fontSize:14,fontWeight:600,textDecoration:'line-through'}}>{g.title}</div>
                          <span className="badge" style={{background:cat.color+'20',color:cat.color,marginTop:2}}>{cat.label}</span>
                        </div>
                      </div>
                      <button className="btn-icon" onClick={()=>setConfirmDel(g.id)}><IcoTrash/></button>
                    </div>
                  </div>
                );
              })}
            </div>
          </>
        )}

        {data.goals.length===0&&(
          <div className="empty">
            <div className="empty-icon">🎯</div>
            <div style={{fontSize:15,fontWeight:700,marginBottom:8,color:'var(--text)'}}>Nenhuma meta ainda</div>
            <div style={{fontSize:13}}>Definir metas claras é o primeiro passo para alcançá-las. O que você quer conquistar?</div>
          </div>
        )}
      </div>

      <Modal open={showAdd} onClose={()=>setShowAdd(false)} title="Nova meta">
        <div className="flex-col gap-12">
          <div className="input-group"><label className="label">Título</label><input className="input" placeholder="Ex: Guardar R$5.000 este ano" value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} autoFocus/></div>
          <div className="input-group"><label className="label">Descrição (opcional)</label><textarea className="input" placeholder="Detalhe sua meta..." value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))} style={{minHeight:60}}/></div>
          <div className="input-group"><label className="label">Categoria</label>
            <select className="input" value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>
              {GOAL_CATS.map(c=><option key={c.id} value={c.id}>{c.label}</option>)}
            </select>
          </div>
          <div className="input-group">
            <label className="label">Progresso atual: {form.progress}%</label>
            <input type="range" min="0" max="100" step="5" value={form.progress} onChange={e=>setForm(f=>({...f,progress:e.target.value}))}/>
          </div>
          <div className="input-group"><label className="label">Data alvo (opcional)</label><input className="input" type="date" value={form.targetDate} onChange={e=>setForm(f=>({...f,targetDate:e.target.value}))}/></div>
          <button className="btn btn-full btn-lg" style={{background:'var(--blue)',color:'white'}} onClick={addGoal}>Criar meta</button>
        </div>
      </Modal>

      <Modal open={!!confirmDel} onClose={()=>setConfirmDel(null)} title="Excluir meta?">
        <p style={{fontSize:14,color:'var(--muted)',marginBottom:20}}>Esta ação não pode ser desfeita.</p>
        <div className="flex gap-10"><button className="btn btn-ghost btn-full" onClick={()=>setConfirmDel(null)}>Cancelar</button><button className="btn btn-danger btn-full" onClick={()=>deleteGoal(confirmDel)}>Excluir</button></div>
      </Modal>
    </div>
  );
};

// ─── Navigation ───────────────────────────────────────────────────────
const NAV=[
  {id:'home',label:'Início',color:'#7C3AED',
    icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>},
  {id:'finance',label:'Finanças',color:'#10B981',
    icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>},
  {id:'health',label:'Saúde',color:'#F59E0B',
    icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>},
  {id:'mind',label:'Mente',color:'#EC4899',
    icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>},
  {id:'goals',label:'Metas',color:'#3B82F6',
    icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>},
];

const Nav=({page,setPage})=>(
  <nav className="nav">
    <div className="nav-inner">
      {NAV.map(item=>(
        <button key={item.id} className={`nav-item${page===item.id?' active':''}`}
          onClick={()=>setPage(item.id)} style={page===item.id?{color:item.color}:{}}>
          {item.icon}
          <span>{item.label}</span>
          {page===item.id&&<div className="nav-dot" style={{background:item.color}}/>}
        </button>
      ))}
    </div>
  </nav>
);

// ─── App ──────────────────────────────────────────────────────────────
const App=()=>{
  const [data,setData]=useState(()=>initData());
  const [page,setPage]=useState('home');
  const [toast,setToast]=useState('');
  const toastTimer=useRef(null);

  const showToast=(msg)=>{
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current=setTimeout(()=>setToast(''),2600);
  };

  if(!data.profile.done){
    return <Setup onDone={(name)=>{
      save(setData,d=>({...d,profile:{name,done:true}}));
    }}/>;
  }

  const props={data,setData,showToast,setPage};

  return(
    <>
      {page==='home'&&<Dashboard {...props}/>}
      {page==='finance'&&<Finance {...props}/>}
      {page==='health'&&<Health {...props}/>}
      {page==='mind'&&<Mind {...props}/>}
      {page==='goals'&&<Goals {...props}/>}
      <Nav page={page} setPage={setPage}/>
      {toast&&<div className="toast">{toast}</div>}
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
