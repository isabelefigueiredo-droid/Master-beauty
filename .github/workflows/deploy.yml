name: Deploy FitLife

on:
  push:
    branches: [main, claude/fitness-workout-diet-app-6qiMW]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: master-beauty/master-beauty/package-lock.json
      - name: Install & Build
        working-directory: master-beauty/master-beauty
        run: npm install && npm run build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: master-beauty/master-beauty/dist
      - uses: actions/deploy-pages@v4
        id: deployment
