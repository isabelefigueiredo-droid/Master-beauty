name: Deploy A Vida Toda

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: master-beauty/master-beauty/package-lock.json

      - name: Install & Build
        working-directory: master-beauty/master-beauty
        run: npm ci && npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: master-beauty/master-beauty/dist
          force_orphan: true
          enable_jekyll: false
